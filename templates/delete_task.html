{% extends "navbar.html" %}

{% block content %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görevi Sil</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ff007f;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 20px;
        }
        button {
            width: 90%;
            padding: 12px;
            background-color: #ffaad4;
            color: white;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-right: 10px;
        }
        button:hover {
            background-color: red;
        }
        a {
            width: 90%;
            padding: 12px;
            background-color: #ffaad4;
            color: white;
            font-size: 1.1rem;
            text-decoration: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #218838;
        }
        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Görevi Sil</h1>
        <p><strong>{{ task.title }}</strong> görevini silmek istediğinizden emin misiniz?</p>

        <div class="action-buttons">
            <form method="post">
                {% csrf_token %}
                <button type="submit">Evet</button>
            </form>
            <a href="{% url 'task_list' %}">Hayır</a>
        </div>
    </div>

</body>
</html>
{% endblock %}
