<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Görev Oluştur</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #ffaad4;
            margin-bottom: 20px;
        }
        label {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 5px;
            display: block;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #ff007f;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff007f;
            color: white;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
    </style>
</head>
<body>
    {% extends "navbar.html" %}
    {% block content %}
        <div class="container">
            <h1>Yeni Görev Oluştur</h1>
            <form method="post">
                {% csrf_token %}
                <label for="title">Başlık:</label>
                <input type="text" id="title" name="title" required placeholder="Görev başlığını girin...">
                
                <label for="description">Açıklama:</label>
                <textarea id="description" name="description" placeholder="Görev hakkında açıklama ekleyin..."></textarea>
                
                <button type="submit">Gönder</button>
            </form>
        </div>
    {% endblock %}

</body>
</html>
